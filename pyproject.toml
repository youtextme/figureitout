[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figureitout"
version = "0.3.0"
description = "Autonomous objective runner — finish the job with evidence. Cursor, Devin, Claude, CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "cel-python>=0.2.0",
]

[project.optional-dependencies]
full = [
    "instructor>=1.0.0",
    "tavily-python>=0.5.0",
    "mem0ai>=0.1.0",
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "Pillow>=10.0.0",
]

[project.scripts]
figureitout = "figureitout.__main__:main"

[project.urls]
Homepage = "https://github.com/youtextme/figureitout"

[tool.setuptools.packages.find]
where = ["."]
include = ["figureitout*"]

[tool.setuptools.package-data]
figureitout = ["policies.yaml", "SKILL.md", "public/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
